<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Drill icon options</title><style>
:root{--bg:#FDF1E8;--surface:#FFFAF5;--ink:#2C2A2B;--muted:#6F635D;--accent:#F3B5B0}
:root[data-theme=dark]{--bg:#272022;--surface:#342A2D;--ink:#F3E7E2;--muted:#A89A9C;--accent:#E9A8A6}
body{margin:0;padding:28px;background:var(--bg);color:var(--ink);font-family:Palatino,serif}
h1{font-size:22px;font-style:italic;margin:0 0 20px}.row{display:flex;gap:40px;flex-wrap:wrap}
.o{display:flex;flex-direction:column;align-items:center;gap:10px;font-style:italic}
.b{display:flex;gap:10px;background:var(--surface);padding:12px;border-radius:16px}
.it{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted)}.it.on{background:var(--accent);color:#2C2A2B}
svg{width:24px;height:24px}svg *{fill:color-mix(in srgb,currentColor 18%,transparent);stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg .n{fill:none}svg .f{fill:currentColor;stroke:none}
button{position:fixed;top:16px;right:16px;font:inherit;padding:6px 14px;border-radius:99px;border:0;background:var(--surface);color:var(--ink)}
</style></head><body><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Light / dark</button>
<h1>Chord drill icon: four options (soft fill)</h1><div class="row">
<div class="o"><div class="b"><div class="it"><svg viewBox="0 0 24 24"><ellipse cx="7.5" cy="17" rx="3.4" ry="2.6"/><ellipse cx="7.5" cy="11" rx="3.4" ry="2.6"/><ellipse cx="7.5" cy="5" rx="3.4" ry="2.6" class="n"/><path class="n" d="M14 6h7M14 12h7M14 18h7"/></svg></div><div class="it on"><svg viewBox="0 0 24 24"><ellipse cx="7.5" cy="17" rx="3.4" ry="2.6"/><ellipse cx="7.5" cy="11" rx="3.4" ry="2.6"/><ellipse cx="7.5" cy="5" rx="3.4" ry="2.6" class="n"/><path class="n" d="M14 6h7M14 12h7M14 18h7"/></svg></div></div>1. Stacked notes</div>
<div class="o"><div class="b"><div class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle class="n" cx="12" cy="12" r="5"/><circle class="f" cx="12" cy="12" r="1.6"/></svg></div><div class="it on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle class="n" cx="12" cy="12" r="5"/><circle class="f" cx="12" cy="12" r="1.6"/></svg></div></div>2. Target</div>
<div class="o"><div class="b"><div class="it"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2.2"/><path class="n" d="M8 7v7M12 7v7M16 7v7"/><path class="n" d="M12 3.2v.1"/></svg></div><div class="it on"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2.2"/><path class="n" d="M8 7v7M12 7v7M16 7v7"/></svg></div></div>3. Keys with a card</div>
<div class="o"><div class="b"><div class="it"><svg viewBox="0 0 24 24"><path d="M4 18V9l8-5 8 5v9z"/><path class="n" d="M9.5 18v-5h5v5"/></svg></div><div class="it on"><svg viewBox="0 0 24 24"><path d="M4 18V9l8-5 8 5v9z"/><path class="n" d="M9.5 18v-5h5v5"/></svg></div></div>4. (spare: house, skip if unwanted)</div>
</div></body></html>
